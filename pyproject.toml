[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-engine"
version = "0.1.0"
description = "Independent Qwen3-TTS Ascend inference and reproducible evaluation"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["qwen3_tts_engine*"]
